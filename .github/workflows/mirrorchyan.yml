name: mirrorchyan

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false

jobs:
  mirrorchyan_mxu:
    # 仅在上游仓库运行；fork 无 MirrorChyan 上传密钥
    if: ${{ github.repository_owner == 'TanyaShue' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [win, linux]
        arch: [aarch64, x86_64]
        exclude:
          - os: linux
            arch: aarch64
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('MaaYYs-{0}-{1}-*-MXU*', matrix.os, matrix.arch) }}
          mirrorchyan_rid: MaaYYs
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: TanyaShue
          repo: MaaYYs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan_exec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [macos]
        arch: [aarch64, x86_64]
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ format('MaaYYs-{0}-{1}-*-MXU.dmg', matrix.os, matrix.arch) }}
          mirrorchyan_rid: MaaYYs_exec
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: TanyaShue
          repo: MaaYYs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MIRRORCHYANUPLOADTOKENMAC }}
