name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false
  release:
    types: [edited]

jobs:
  mirrorchyan_mxu:
    # 仅在上游仓库运行；fork 无 MirrorChyan 上传密钥
    if: ${{ github.repository_owner == 'TanyaShue' }}
    runs-on: ubuntu-latest
    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MaaYYs
          version_name: ${{ inputs.tag }}

          owner: TanyaShue
          repo: MaaYYs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan_exec:
    runs-on: ubuntu-latest
    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MaaYYs_exec
          version_name: ${{ inputs.tag }}

          owner: TanyaShue
          repo: MaaYYs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MIRRORCHYANUPLOADTOKENMAC }}
